name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Signal rapide (~2 min) : logique pure testable sans dépendances OS.
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Cargo tests core (logique pure)
        run: cargo test --manifest-path app/Cargo.toml -p screenshotpp-core
      - name: Release storefront readiness
        shell: bash
        run: scripts/check-release-readiness.sh

  # Build + tests de l'app complète (egui/xcap/OS), et binaire de test téléchargeable
  # (exécutable + ffmpeg à côté) en artefact.
  # Sur Windows, on force cargo à utiliser le disque D: (plus rapide que C: pour
  # les charges « beaucoup de petits fichiers » d'une compil Rust). L'env est posé
  # AVANT le cache pour que rust-cache vise le bon dossier.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch ffmpeg sidecar
        shell: bash
        run: scripts/fetch-ffmpeg.sh ${{ runner.os == 'Windows' && 'windows' || 'macos-arm' }}
      - uses: dtolnay/rust-toolchain@stable
      - name: "Use D: drive for cargo (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path D:\cargo, D:\target | Out-Null
          "CARGO_HOME=D:\cargo" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CARGO_TARGET_DIR=D:\target" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.os == 'Windows' && 'app -> D:\target' || 'app' }}
      - name: Cargo tests
        run: cargo test --manifest-path app/Cargo.toml --workspace
      - name: Build release binary
        run: cargo build --release --manifest-path app/Cargo.toml
      - name: Stage test build
        shell: bash
        run: |
          target="${CARGO_TARGET_DIR:-app/target}"
          mkdir -p dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "$target/release/screenshotpp.exe" dist/ScreenShotPP.exe
            cp app/binaries/ffmpeg-x86_64-pc-windows-msvc.exe dist/ffmpeg.exe
          else
            cp "$target/release/screenshotpp" dist/ScreenShotPP
            cp app/binaries/ffmpeg-aarch64-apple-darwin dist/ffmpeg
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: screenshotpp-${{ runner.os }}
          path: dist/
          if-no-files-found: error
